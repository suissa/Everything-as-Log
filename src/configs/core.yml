# Everything-as-Log canonical behavior configuration.
# Application code only declares @EaL("behavior") or @EaL.
# Every log label is an emoji and can be changed here.

config:
  displayScope: true
  displayBadge: true
  displayDate: false
  displayFilename: false
  displayLabel: true
  displayTimestamp: false
  underlineLabel: true
  underlineMessage: false
  underlinePrefix: false
  underlineSuffix: false
  uppercaseLabel: false

behaviors:
  error:
    execution: error
    logger: error
    badge: "🚨"
    color: red
    label: "🚨"
    logLevel: error
    message: "{error.name}: {error.message}"

  fatal:
    execution: error
    logger: fatal
    badge: "🚨"
    color: red
    label: "🚨"
    logLevel: error
    message: "{error.name}: {error.message}"

  fav:
    execution: always
    logger: fav
    badge: "❤️"
    color: magenta
    label: "❤️"
    logLevel: info
    message: "{name}"

  info:
    execution: always
    logger: info
    badge: "ℹ️"
    color: blue
    label: "ℹ️"
    logLevel: info
    message: "{name}"

  star:
    execution: always
    logger: star
    badge: "⭐"
    color: yellow
    label: "⭐"
    logLevel: info
    message: "{name}"

  success:
    execution: success
    logger: success
    badge: "🎉"
    color: green
    label: "🎉"
    logLevel: info
    message: "{name} completed successfully"

  wait:
    execution: always
    logger: wait
    badge: "⏳"
    color: blue
    label: "⏳"
    logLevel: info
    message: "{name} waiting"

  warning:
    execution: error
    logger: warn
    badge: "⚠️"
    color: yellow
    label: "⚠️"
    logLevel: warn
    message: "{error.name}: {error.message}"

  complete:
    execution: success
    logger: complete
    badge: "🤝"
    color: cyan
    label: "🤝"
    logLevel: info
    message: "{name} completed"

  pending:
    execution: always
    logger: pending
    badge: "⏳"
    color: magenta
    label: "⏳"
    logLevel: info
    message: "{name} pending"

  note:
    execution: always
    logger: note
    badge: "📝"
    color: blue
    label: "📝"
    logLevel: info
    message: "{name}"

  timer_start:
    execution: always
    logger: start
    badge: "👋"
    color: green
    label: "👋"
    logLevel: info
    message: "{name} started"

  pause:
    execution: always
    logger: pause
    badge: "⏸️"
    color: yellow
    label: "⏸️"
    logLevel: info
    message: "{name} paused"

  debug:
    execution: always
    logger: debug
    badge: "⌛"
    color: red
    label: "⌛"
    logLevel: debug
    message: "{name}"

  await:
    execution: always
    logger: await
    badge: "⏳"
    color: blue
    label: "⏳"
    logLevel: info
    message: "{name} awaiting"

  watching:
    execution: always
    logger: watch
    badge: "🔎"
    color: yellow
    label: "🔎"
    logLevel: info
    message: "{name}"

  timer_end:
    execution: always
    logger: complete
    badge: "🤝"
    color: cyan
    label: "🤝"
    logLevel: info
    message: "{name} finished"

  log:
    execution: always
    logger: log
    badge: "📋"
    color: ""
    label: "📋"
    logLevel: info
    message: "{name}"